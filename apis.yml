apis:
- aid: gameanalytics:gameanalytics-data-export-api
  name: GameAnalytics Data Export (PipelineIQ)
  tags:
  - Data Export
  - PipelineIQ
  - Raw Events
  - Streaming
  - Data Warehouse
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.gameanalytics.com/pipelineiq/data-export
  baseURL: >-
    https://docs.gameanalytics.com/products-and-features/pipeline-iq/data-export/json-schemas/
  properties:
  - url: https://www.gameanalytics.com/pipelineiq/data-export
    type: Documentation
  - url: >-
      https://docs.gameanalytics.com/products-and-features/pipeline-iq/data-export/json-schemas/
    type: APIReference
  description: >-
    PipelineIQ raw data export streams every gameplay event as JSON objects (a metadata wrapper plus an
    event data object) in real time, with historical backfill, into a customer's own cloud environment
    - AWS S3, Google BigQuery, Google Cloud Storage - for use in Tableau, Looker, or Power BI. It is a
    data pipeline rather than a request/response REST API.
